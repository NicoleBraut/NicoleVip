<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nicole VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{

font-family:Poppins,sans-serif;

background:#080808;

background-image:
radial-gradient(circle at top,#46102b 0%,#080808 60%);

color:white;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:25px;

}

.card{

width:100%;
max-width:430px;

background:rgba(255,255,255,.06);

backdrop-filter:blur(20px);

border-radius:28px;

overflow:hidden;

box-shadow:0 20px 60px rgba(0,0,0,.6);

border:1px solid rgba(255,255,255,.08);

}

.cover{

width:100%;

height:320px;

object-fit:cover;

display:block;

}

.content{

padding:35px;

text-align:center;

}

h1{

font-size:40px;

font-weight:700;

letter-spacing:2px;

}

p{

margin-top:10px;

color:#ffc8dd;

margin-bottom:35px;

}

.btn{

display:block;

padding:18px;

margin:18px 0;

text-decoration:none;

color:white;

border-radius:18px;

background:linear-gradient(90deg,#ff4f9b,#ff77b7);

font-size:18px;

font-weight:600;

transition:.25s;

}

.btn:hover{

transform:translateY(-4px);

box-shadow:0 0 25px rgba(255,105,180,.45);

}

.footer{

margin-top:25px;

font-size:13px;

color:#999;

}

</style>

</head>

<body>

<div class="card">

<img class="cover" src="capa.jpg">

<div class="content">

<h1>Nicole</h1>

<p>Bem-vindo ao meu espaço oficial. Escolha uma plataforma para continuar.</p>

<a class="btn" href="https://SEULINKPRIVACY">🔒 Privacy</a>

<a class="btn" href="https://SEULINKTELEGRAM">💬 Telegram</a>

<div class="footer">

© Nicole VIP

</div>

</div>

</div>

</body>

</html>
